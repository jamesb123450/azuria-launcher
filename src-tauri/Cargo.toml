[package]
name = "azuria-launcher"
version = "0.2.1"
description = "Azuria Minecraft Java launcher"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "azuria_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false }
azuria-auth = { path = "../crates/azuria-auth" }
azuria-core = { path = "../crates/azuria-core" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
