name: Foundation checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azuria-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo fmt --manifest-path crates/azuria-core/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path crates/azuria-core/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/azuria-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run desktop:build -- --debug
      - uses: actions/upload-artifact@v4
        with:
          name: azuria-windows-development-installer
          path: src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    # Explicit opt-in: never publish code or binaries from a pull request.
    if: github.event_name == 'push' && vars.AZURIA_AUTO_RELEASE == 'true' && github.ref_name == vars.AZURIA_RELEASE_BRANCH
    needs: [frontend, windows]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      AZURIA_RELEASE_REPOSITORY: ${{ github.repository }}
      AZURIA_RELEASE_COMMIT: ${{ github.sha }}
      AZURIA_RELEASE_VERSION: 0.2.${{ github.run_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify public update host and configuration
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) { throw "The workflow token is unavailable" }
          $private = gh api "repos/$env:AZURIA_RELEASE_REPOSITORY" --jq .private
          if ($LASTEXITCODE -ne 0 -or $private -ne "false") { throw "The launcher repository must be public to host anonymous updates" }
          if ([int]($env:AZURIA_RELEASE_VERSION.Split('.')[2]) -gt 65535) { throw "Windows version limit exceeded" }
          @{ version = $env:AZURIA_RELEASE_VERSION; bundle = @{ createUpdaterArtifacts = $true } } | ConvertTo-Json -Depth 4 | Set-Content update-build.json
      - run: npm ci
      - name: Build signed update
        run: npm run desktop:build -- --config update-build.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/prepare-update.mjs
      - name: Publish complete update atomically
        shell: pwsh
        run: |
          $tag = "v$env:AZURIA_RELEASE_VERSION"
          gh release create $tag --repo $env:AZURIA_RELEASE_REPOSITORY --draft --target $env:AZURIA_RELEASE_COMMIT --title "Azuria $env:AZURIA_RELEASE_VERSION" --notes "Development build. Microsoft sign-in and Minecraft launch are still being implemented."
          if ($LASTEXITCODE -ne 0) { throw "Could not create draft release" }
          $assets = Get-ChildItem src-tauri/target/release/bundle/nsis -File | Where-Object { $_.Name -match '\.exe(\.sig)?$|^latest\.json$' } | ForEach-Object { $_.FullName }
          gh release upload $tag @assets --repo $env:AZURIA_RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Could not upload all update assets" }
          gh release edit $tag --repo $env:AZURIA_RELEASE_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release" }
