name: Foundation checks
on:
  push:
    branches: [main, "feat/**"]
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".github/scripts/release-scope.mjs"
  pull_request:
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".github/scripts/release-scope.mjs"
  workflow_dispatch:
env:
  AZURIA_DISCORD_APPLICATION_ID: ${{ vars.AZURIA_DISCORD_APPLICATION_ID }}
  AZURIA_CURSEFORGE_PROXY_URL: ${{ vars.AZURIA_CURSEFORGE_PROXY_URL }}
permissions:
  contents: read
concurrency:
  group: azuria-${{ github.workflow }}-${{ github.ref }}
  # Preserve active main-branch builds; newer feature commits may supersede old checks.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  release-scope:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: node .github/scripts/release-scope.mjs
        env:
          AZURIA_BEFORE: ${{ github.event.before }}
          AZURIA_COMMIT: ${{ github.sha }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo fmt --manifest-path crates/azuria-auth/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path crates/azuria-auth/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/azuria-auth/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path crates/azuria-core/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path crates/azuria-core/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/azuria-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path crates/azuria-content/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path crates/azuria-content/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/azuria-content/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path crates/azuria-launch/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path crates/azuria-launch/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/azuria-launch/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run desktop:build -- --debug
      - uses: actions/upload-artifact@v4
        with:
          name: azuria-windows-development-installer
          path: src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    # Explicit opt-in: never publish code or binaries from a pull request.
    if: github.event_name == 'push' && needs.release-scope.outputs.publish == 'true' && vars.AZURIA_AUTO_RELEASE == 'true' && github.ref_name == vars.AZURIA_RELEASE_BRANCH
    needs: [frontend, windows, release-scope]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify public update host and allocate release version
        run: node scripts/release-host.mjs configure
        env:
          AZURIA_RELEASES_TOKEN: ${{ secrets.AZURIA_RELEASES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Build signed update
        run: npm run desktop:build -- --config update-build.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/prepare-update.mjs
      - name: Publish signed public update and legacy bridge
        run: node scripts/release-host.mjs publish
        env:
          AZURIA_RELEASES_TOKEN: ${{ secrets.AZURIA_RELEASES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh website build after publishing
        continue-on-error: true
        run: gh workflow run website.yml --ref main --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
