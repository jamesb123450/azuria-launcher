name: Azuria Capes build
on:
  pull_request:
    paths:
      - "mods/azuria-capes/**"
      - "apps/app-frontend/public/cosmetics/azuria-starter.png"
      - ".github/workflows/capes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - run: gradle --no-daemon build
        working-directory: mods/azuria-capes
      - uses: actions/upload-artifact@v4
        with:
          name: azuria-capes-fabric-1.21.1
          path: mods/azuria-capes/build/libs/azuria-capes-0.1.0.jar
          if-no-files-found: error
