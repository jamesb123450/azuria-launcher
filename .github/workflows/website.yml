name: Website build and deploy
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "website/**"
      - "scripts/publish-website.mjs"
      - "scripts/release-host.mjs"
      - ".github/workflows/website.yml"
      - ".github/scripts/release-scope.mjs"
  pull_request:
    paths:
      - "website/**"
      - "scripts/publish-website.mjs"
      - "scripts/release-host.mjs"
      - ".github/workflows/website.yml"
      - ".github/scripts/release-scope.mjs"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azuria-website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURIA_SITE_URL: https://jamesb123450.github.io/azuria-releases/
      AZURIA_ADSENSE_ENABLED: ${{ vars.AZURIA_ADSENSE_ENABLED }}
      AZURIA_ADSENSE_CMP_READY: ${{ vars.AZURIA_ADSENSE_CMP_READY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh public release metadata
        run: npm --prefix website run refresh
      - run: npm --prefix website run build
      - run: npm --prefix website test
      - name: Save reviewable website artifact
        uses: actions/upload-artifact@v4
        with:
          name: azuria-website
          path: website/dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish built website to public distribution repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/publish-website.mjs
        env:
          AZURIA_RELEASES_TOKEN: ${{ secrets.AZURIA_RELEASES_TOKEN }}
