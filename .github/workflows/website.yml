name: Website build and deploy
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/frontend/**"
      - "packages/release-tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website.yml"
      - ".github/scripts/release-scope.mjs"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "packages/release-tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website.yml"
      - ".github/scripts/release-scope.mjs"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azuria-website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURIA_SITE_URL: https://jamesb123450.github.io/azuria-releases/
      AZURIA_ADSENSE_ENABLED: ${{ vars.AZURIA_ADSENSE_ENABLED }}
      AZURIA_ADSENSE_CMP_READY: ${{ vars.AZURIA_ADSENSE_CMP_READY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Refresh public release metadata
        run: npm run refresh --workspace=azuria-website
      - run: npm run build --workspace=azuria-website
      - run: npm run test --workspace=azuria-website
      - name: Save reviewable website artifact
        uses: actions/upload-artifact@v4
        with:
          name: azuria-website
          path: apps/frontend/dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish built website to public distribution repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run publish:site --workspace=azuria-website
        env:
          AZURIA_RELEASES_TOKEN: ${{ secrets.AZURIA_RELEASES_TOKEN }}
