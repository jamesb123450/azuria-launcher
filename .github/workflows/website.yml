name: Website build and deploy
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".github/scripts/release-scope.mjs"
      - "docs/WEBSITE.md"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".github/scripts/release-scope.mjs"
      - "docs/WEBSITE.md"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azuria-website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh public release metadata
        run: npm --prefix website run refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm --prefix website run build
      - run: npm --prefix website test
      - name: Save reviewable website artifact
        uses: actions/upload-artifact@v4
        with:
          name: azuria-website
          path: website/dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
