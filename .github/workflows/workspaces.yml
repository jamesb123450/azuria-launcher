name: Workspace and service checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=azuria-launcher-frontend
      - run: node --test tests/*.test.mjs
      - run: npm run test --workspace=@azuria/release-tools
      - run: npm run service:test
      - run: npm run accounts:build
      - run: npm run accounts:test
      - run: npm run test --workspace=azuria-studios-website
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check services/accounts/supabase/functions/account-action/index.ts
      - run: deno test --allow-env services/accounts/supabase/functions/account-action/index.test.ts
      - run: deno check services/accounts/supabase/functions/feedback-submit/index.ts
      - run: deno check services/accounts/supabase/functions/admin-action/index.ts
      - run: deno test --allow-env services/accounts/supabase/functions/admin-action/index.test.ts
