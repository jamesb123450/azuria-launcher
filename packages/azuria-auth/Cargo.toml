[package]
name = "azuria-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
crypto_box = "0.9.1"
x25519-dalek = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
url = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
