<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Your account for Azuria Studios and Azuria Launcher."
    />
    <title>Azuria Account</title>
    <link rel="icon" href="/azuria.png" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="https://azuriasmp.org"
        ><img src="/azuria.png" alt="" />Azuria<span>Account</span></a
      ><a href="https://launcher.azuriasmp.org">Get the launcher ↗</a>
    </header>
    <main>
      <aside class="intro">
        <span class="eyebrow">AZURIA STUDIOS</span>
        <h1>One account.<br /><span>More to come.</span></h1>
        <p>
          Your place in Azuria. Manage your profile and get ready for what’s
          next.
        </p>
        <div class="intro-note">
          <span class="status-dot"></span> Built for your next adventure.
        </div>
      </aside>
      <section class="card" aria-labelledby="page-title">
        <div class="card-heading">
          <img src="/azuria.png" alt="" /><span>YOUR AZURIA ACCOUNT</span>
        </div>
        <h2 id="page-title">Welcome back</h2>
        <p id="subtitle" class="muted">Sign in to continue.</p>
        <p id="notice" role="status" aria-live="polite" hidden></p>
        <p id="error" role="alert" hidden></p>
        <div id="content" aria-busy="true">
          <p class="muted">Loading your account…</p>
        </div>
      </section>
    </main>
    <footer>
      <span>© <span id="year"></span> Azuria Studios.</span>
      <nav aria-label="Legal">
        <a href="/privacy/">Privacy</a><a href="/terms/">Terms</a>
      </nav>
    </footer>
  </body>
</html>
