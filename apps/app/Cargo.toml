[package]
name = "azuria-launcher"
version = "0.2.1"
description = "Azuria Minecraft Java launcher"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "azuria_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features=["json","multipart","query"] }
base64 = "0.22"
getrandom = "0.4.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = {version="0.25",default-features=false,features=["png"]}
azuria-auth = { path = "../../packages/azuria-auth" }
azuria-core = { path = "../../packages/azuria-core" }
azuria-launch = { path = "../../packages/azuria-launch" }
azuria-content = { path = "../../packages/azuria-content" }

tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
rfd = "0.17"
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
